# ---------------------------------------------------------------------------
# Consultora DH - nginx (front web server)
#
# Responsibilities:
#   - serve the compiled front-end assets and the public/ directory
#   - hand every dynamic request to PHP-FPM
#   - apply baseline security headers (application-level headers are also set
#     by Laravel middleware so that the API responses are covered as well)
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # The Vite dev server emits already-minified assets, but compressing the
    # compiled production bundle is still worthwhile.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Do not advertise the web server.
    server_tokens off;

    # --- Security headers ---------------------------------------------------
    #
    # There are deliberately **no** `add_header` directives at server level.
    # Laravel's `SecurityHeaders` middleware already sets the same four headers
    # on every dynamic response, and nginx's `add_header` appends rather than
    # replaces: keeping both sent each header twice. Worse, any `add_header`
    # inside a location resets inheritance, so the static-asset locations below
    # would have silently lost every security header while still adding their
    # cache policy.
    #
    # The static locations therefore repeat the headers themselves, and dynamic
    # responses get them from the application. The values must stay identical to
    # `app/Http/Middleware/SecurityHeaders.php`.
    #
    # `microphone=(self)` and not `microphone=()`: the support conversation screen
    # records voice notes. `camera=()` and everything else stays denied.

    # --- Hidden files --------------------------------------------------------
    # Never serve dotfiles (.env, .git, editor swap files, ...).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # --- Front controller ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        # A07: the assistant turn (a question answered through a chain of free
        # model candidates, plus any tool rounds) is a legitimately long request.
        # This is the wall-clock ceiling those turns must finish under; the
        # assistant's own budget (ai.total_budget_seconds) is deliberately below
        # it, so a slow provider surfaces as the assistant's own 503 with a
        # diagnosis rather than as an opaque gateway timeout.
        fastcgi_read_timeout 180s;
    }

    # Only the front controller is executable.
    location ~ \.php$ {
        return 404;
    }

    # --- Static assets -------------------------------------------------------
    # A request for a file that looks like an asset must resolve to that file or
    # to a 404. It must NEVER fall back to index.php: returning the HTML shell
    # with a `text/html` body for a missing .js makes the browser report a
    # confusing syntax error instead of a missing file.
    #
    # SPA route fallback is unchanged and still happens in `location /` above,
    # which only matches URLs without a file extension.

    # Vite's hashed build output. The filename changes with its contents, so the
    # browser can keep it for a year and never revalidate it. This is the only
    # group that earns `immutable`.
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }

    # The service worker must never be served from a stale cache: a cached copy
    # is exactly what prevents a new deployment from taking over. `no-cache`
    # still allows the browser to store it, but forces revalidation.
    location = /sw.js {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }

    # Icons and the manifest are stable but editable without a hash in their
    # name. A short TTL with revalidation updates them on the next visit without
    # letting them go stale for a week.
    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }

    location = /manifest.json {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }

    # Everything else that looks like a static file: a moderate TTL, no
    # `immutable`, because these names are not content hashes.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|txt|xml|webmanifest)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }

    # --- Health check --------------------------------------------------------
    # Answered by nginx itself so that the container health check never depends
    # on PHP or on any backing service.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Laravel storage -----------------------------------------------------
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    }
}
