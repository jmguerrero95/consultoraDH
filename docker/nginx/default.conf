# ---------------------------------------------------------------------------
# Consultora DH - nginx (front web server)
#
# Responsibilities:
#   - serve the compiled front-end assets and the public/ directory
#   - hand every dynamic request to PHP-FPM
#   - apply baseline security headers (application-level headers are also set
#     by Laravel middleware so that the API responses are covered as well)
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # The Vite dev server emits already-minified assets, but compressing the
    # compiled production bundle is still worthwhile.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Do not advertise the web server.
    server_tokens off;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

    # --- Hidden files --------------------------------------------------------
    # Never serve dotfiles (.env, .git, editor swap files, ...).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # --- Front controller ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Only the front controller is executable.
    location ~ \.php$ {
        return 404;
    }

    # --- Static assets -------------------------------------------------------
    # A request for a file that looks like an asset must resolve to that file or
    # to a 404. It must NEVER fall back to index.php: returning the HTML shell
    # with a `text/html` body for a missing .js makes the browser report a
    # confusing syntax error instead of a missing file.
    #
    # SPA route fallback is unchanged and still happens in `location /` above,
    # which only matches URLs without a file extension.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|map|txt|xml|webmanifest)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # --- Health check --------------------------------------------------------
    # Answered by nginx itself so that the container health check never depends
    # on PHP or on any backing service.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Laravel storage -----------------------------------------------------
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }
}
