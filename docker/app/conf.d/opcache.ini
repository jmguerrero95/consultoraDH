; ---------------------------------------------------------------------------
; Consultora DH - OPcache
;
; OPcache is enabled in every environment. In development the cache is
; revalidated frequently so that code changes are picked up immediately.
; ---------------------------------------------------------------------------

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
