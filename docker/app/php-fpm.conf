; ---------------------------------------------------------------------------
; Consultora DH - PHP-FPM pool
;
; Replaces the pool shipped by the base image. The image already defines a
; `[www]` pool, and PHP-FPM ignores a second pool with the same name, so this
; file has to *replace* www.conf rather than add to the pool list.
; ---------------------------------------------------------------------------

[www]

; The pool runs as the unprivileged `www-data` account. PHP-FPM refuses to
; start a pool as root, and running the workers as root would be wrong anyway.
; The container entry point (which does run as root) makes `storage/` and
; `bootstrap/cache/` writable for it.
user = www-data
group = www-data

; TCP, because nginx reaches the pool over the Docker network.
listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; An administrative platform has a small working set; log only real problems.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr

; The application reads its own configuration from .env, so the environment of
; the container must not be cleared.
clear_env = no

; Lightweight liveness probe. The pool answers this path directly, without
; invoking PHP, the database or any application code. Used by the container
; health check in docker/app/healthcheck.sh.
ping.path = /fpm-ping
ping.response = pong

; A request that is not a legitimate Laravel entry point is refused outright.
security.limit_extensions = .php
