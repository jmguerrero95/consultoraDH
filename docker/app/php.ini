; ---------------------------------------------------------------------------
; Consultora DH - base PHP settings
; ---------------------------------------------------------------------------

; Expose errors to the log only. The web SAPI never renders raw errors:
; production-safe error handling is enforced by Laravel's exception handler.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Keep the request body within sane administrative limits.
post_max_size = 32M
upload_max_filesize = 16M
memory_limit = 512M

max_execution_time = 120

; Sessions are handled by Laravel. Expose the cookie to PHP so that Laravel's
; own session layer remains the single source of truth for cookie behaviour.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1

date.timezone = UTC

; Hardening for a self-hosted administrative platform.
allow_url_fopen = On
expose_php = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
