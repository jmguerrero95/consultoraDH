# ---------------------------------------------------------------------------
# Consultora DH - local development environment
#
# Run every command from the project root (the directory that holds this file):
#     docker compose up -d
#     docker compose exec app php artisan migrate
#
# PostgreSQL and Redis are intentionally NOT published to the host: they are
# only reachable from inside the `consultora-dh` network. Only nginx (8080) and
# the Vite development server (5173) are exposed to the Windows browser.
# ---------------------------------------------------------------------------

name: consultora-dh

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: consultora-dh/app:local

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:18.6
    container_name: consultora-dh-postgres
    restart: unless-stopped
    environment:
      # --- Bootstrap role (superuser), used ONLY by the initialisation script.
      # The official image always creates POSTGRES_USER as a superuser.
      POSTGRES_DB: ${POSTGRES_DB:-consultora_dh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

      # --- Application role, passed here only so the initialisation script can
      # create it as a NON-superuser owner of the Consultora DH databases.
      # Laravel reads DB_USERNAME / DB_PASSWORD from .env directly.
      DB_DATABASE: ${DB_DATABASE:-consultora_dh}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-consultora_dh_test}
      # The end to end database. Created alongside the other two, for the same
      # reason: the Playwright suite writes real records and must not write them
      # into development.
      DB_E2E_DATABASE: ${DB_E2E_DATABASE:-consultora_dh_e2e}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

      # --- Dedicated backup role, created by 02-create-backup-role.sh on a
      # fresh volume. Empty by default: the init script skips it and the backup
      # sidecar stays disabled until the operator supplies a password.
      BACKUP_DB_USER: ${BACKUP_DB_USER:-consultora_dh_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}

      # Deterministic collation, independent of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # PostgreSQL 18 stores its data in a version specific subdirectory of
      # /var/lib/postgresql, so the volume is mounted at the parent directory.
      # Mounting /var/lib/postgresql/data directly is rejected by the image.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-consultora_dh} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - consultora-dh

  redis:
    image: redis:8.10.2-alpine
    container_name: consultora-dh-redis
    restart: unless-stopped
    # Cache, session store, rate-limit counters and the queue broker.
    # Persistence is enabled (appendonly) so that a restart does not silently
    # drop queued jobs or invalidate every active administrator session.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      # The server requires a password, so the probe has to authenticate.
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - consultora-dh

  # ----------------------------------------------------------- application
  app:
    <<: *app-image
    container_name: consultora-dh-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Named volumes keep the two large dependency trees inside the Docker
      # filesystem. Reading them through the host bind mount is dramatically
      # slower (WSL 9p / Docker Desktop gRPC-FUSE).
      - vendor:/var/www/html/vendor
      # The exchange directory with the document converter. Mounted
      # unconditionally so a plain `docker compose up` behaves exactly as it
      # did before; the converter only exists under the `documents` profile, and
      # nothing references this path until it does.
      - document-work:/var/www/html/storage/app/document-work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/consultora-dh-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - consultora-dh

  # Workers are split by blast radius. A 10-minute import used to occupy the
  # only worker, so support replies, notifications and AI jobs waited behind
  # it; a retry_after below the import timeout could also hand the same job to
  # a second worker while the first one was still running.
  #
  # Each service has an explicit --timeout. REDIS_QUEUE_RETRY_AFTER (900 s)
  # must stay above the largest one (imports, 630 s) plus a shutdown margin;
  # see config/queue.php.
  queue:
    <<: *app-image
    container_name: consultora-dh-queue
    restart: unless-stopped
    working_dir: /var/www/html
    # Interactive work that must not wait behind imports or AI generation.
    command: ["php", "artisan", "queue:work", "--queue=default,support,notifications", "--sleep=3", "--tries=3", "--timeout=180", "--max-time=3600", "--verbose"]
    stop_grace_period: 200s
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      # Conversion runs on the queue as well as in a request, so the worker
      # needs the same exchange directory the converter reads.
      - document-work:/var/www/html/storage/app/document-work
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  # A04's ParseLegacyImport, BuildLegacyImportPlan and ApplyLegacyImport run
  # here with the 600 s budget from config/imports.php. Nothing else shares
  # this queue, so a long workbook cannot delay support or AI work.
  queue-imports:
    <<: *app-image
    container_name: consultora-dh-queue-imports
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--queue=imports", "--sleep=3", "--tries=3", "--timeout=630", "--max-time=3600", "--verbose"]
    # Give the worker time to finish the current import on a restart instead
    # of killing it in the middle of the apply phase.
    stop_grace_period: 660s
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - document-work:/var/www/html/storage/app/document-work
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  # Assistant background work (document extraction, generation, research).
  # It has its own worker because a provider retry can take minutes.
  queue-ai:
    <<: *app-image
    container_name: consultora-dh-queue-ai
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--queue=ai-tasks", "--sleep=1", "--tries=3", "--timeout=330", "--max-time=3600", "--verbose"]
    stop_grace_period: 340s
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - document-work:/var/www/html/storage/app/document-work
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  # Automation runs and their external deliveries. Kept away from interactive
  # support so a slow provider or a retrying Telegram call does not delay a
  # person's reply.
  queue-automations:
    <<: *app-image
    container_name: consultora-dh-queue-automations
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--queue=automations", "--sleep=3", "--tries=3", "--timeout=180", "--max-time=3600", "--verbose"]
    stop_grace_period: 200s
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - document-work:/var/www/html/storage/app/document-work
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  # Reverb WebSocket server for realtime support
  reverb:
    <<: *app-image
    container_name: consultora-dh-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    # Use port 8081 internally to avoid conflict with nginx on 8080
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    ports:
      # Reverb on host port 8081 (different from nginx on 8080)
      - "127.0.0.1:8081:8081"
    environment:
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST:-0.0.0.0}
      REVERB_PORT: ${REVERB_PORT:-8081}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  scheduler:
    <<: *app-image
    container_name: consultora-dh-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work", "--verbose"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  # Backup/restore sidecar. Kept behind the `ops` profile so a plain
  # `docker compose up` does not start a second PostgreSQL client image, and
  # so the operator must acknowledge the backup credentials/encryption setup.
  #
  #   docker compose --profile ops up -d backup
  #
  # The image is postgres:18.6, matching the server major version. The PHP
  # image has pdo_pgsql but not pg_dump/pg_restore/createdb/dropdb.
  backup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: consultora-dh/backup:local
    container_name: consultora-dh-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${BACKUP_DB_USER:-consultora_dh_backup}
      PGPASSWORD: ${BACKUP_DB_PASSWORD:-}
      PGDATABASE: ${DB_DATABASE:-consultora_dh}
      BACKUP_DIR: /backups
      PRIVATE_STORAGE: /var/www/html/storage/app/private
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-true}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_ENCRYPTION_KEY_FILE: ${BACKUP_ENCRYPTION_KEY_FILE:-}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
    volumes:
      # Scripts come from the checkout so a fix is not trapped in an old image.
      - ./scripts:/scripts:ro
      # Read-only secret data. The backup process runs as root inside this
      # isolated container because application files may be 0600 www-data.
      - ./storage/app/private:/var/www/html/storage/app/private:ro
      # Persistent, operator-controlled location. Point BACKUP_HOST_DIR at an
      # external/off-host mount in production.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      # For an off-host copy, add a second bind in a local override and set
      # BACKUP_OFFSITE_DIR to its container path (for example /backups-offsite).
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/backup-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    networks:
      - consultora-dh

  # ------------------------------------------------------------------- web
  nginx:
    image: nginx:1.31-alpine
    container_name: consultora-dh-nginx
    restart: unless-stopped
    ports:
      # Published on the loopback interface only, so the application is not
      # reachable from the local network. The Windows browser still reaches it
      # at http://localhost:<APP_PORT>.
      # Host port chosen after inspecting the ports already in use on the
      # development machine. See docs/DEVELOPMENT.md.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - consultora-dh

  # -------------------------------------------------------------- frontend
  node:
    image: node:24.21.0-bookworm-slim
    container_name: consultora-dh-node
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["bash", "docker/node/start.sh"]
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      # Playwright browsers are large; keep them out of the container layer.
      - playwright-browsers:/ms-playwright
    ports:
      # Loopback only: the dev asset server has no reason to be on the LAN.
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # FIX-EXPORT-IMPORT-04. The default is 1, not 0, because this service can
      # only ever run with the project bind-mounted, and on the documented stack
      # (Docker Desktop over WSL, project on a Windows drive) that mount delivers
      # no inotify events. With polling off the server starts, answers every
      # request and reports healthy while its module graph never invalidates — so
      # it keeps serving the transformation from its last start and the browser
      # shows an interface that no longer matches the source, with nothing
      # failing anywhere to say so. `vite.config.ts` reads this through `loadEnv`
      # as well; it is declared here so the process environment and the file
      # agree, and so `docker/node/start.sh` can report what is in force.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-1}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - consultora-dh

  # ------------------------------------------------------ web search (A07)
  #
  # A free, self-hosted meta search engine. It is what makes the assistant's
  # web research real rather than simulated: there is no paid search API here
  # and no key, and `WebSearchTool` speaks its JSON format already.
  #
  # Two things make this safe to add alongside the frozen application:
  #
  #   - It is opt-in. `profiles: ["search"]` means a plain `docker compose up`
  #     behaves exactly as it did before; search is started deliberately.
  #   - It publishes no port. It is reachable only as `http://searxng:8080`
  #     from inside the project's network, so it cannot be used as an open
  #     relay by anything on the host or the LAN. An open SearXNG is a
  #     denial-of-service surface and an abuse target; that is precisely why it
  #     must not be exposed.
  #
  # The limiter is on so an accidentally unbounded query loop cannot be used to
  # amplify requests against the upstream engines on our behalf.
  searxng:
    image: searxng/searxng:latest
    container_name: consultora-dh-searxng
    restart: unless-stopped
    profiles: ["search"]
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      SEARXNG_BIND_ADDRESS: "0.0.0.0:8080"
      # The application only ever reads the JSON format. Leaving it disabled
      # keeps an engine response from being rendered as HTML somewhere.
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on: []
    networks:
      - consultora-dh

  # ------------------------------------------------- document conversion
  #
  # Converts Office documents to PDF using LibreOffice headless.
  #
  # It is a separate service for two reasons. LibreOffice is a large office
  # suite and would weigh down every application and queue worker to serve one
  # capability. More to the point, it is a parser for untrusted input, and
  # confining it here means a fault in it cannot reach the database, the
  # credentials or the application process.
  #
  # It shares one directory with the application and publishes no port: the
  # only way to reach it is from inside this network. It runs as an
  # unprivileged user, disables macros and external resource retrieval, and
  # builds a throwaway profile per conversion so one document's state cannot
  # influence the next. See docker/converter/Dockerfile for the full argument.
  converter:
    build:
      context: .
      dockerfile: docker/converter/Dockerfile
    image: consultora-dh/converter:local
    container_name: consultora-dh-converter
    restart: unless-stopped
    profiles: ["documents"]
    volumes:
      # The one thing it shares with the application: a directory the
      # application writes into and the converter reads, and vice versa.
      - document-work:/work
    # Bounded because it is the only part of the system that expands whatever
    # a document asks it to. A runaway conversion should die here rather than
    # take the host's memory with it.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    networks:
      - consultora-dh

networks:
  consultora-dh:
    name: consultora-dh
    driver: bridge

volumes:
  postgres-data:
    name: consultora-dh-postgres-data
  redis-data:
    name: consultora-dh-redis-data
  vendor:
    name: consultora-dh-vendor
  node_modules:
    name: consultora-dh-node-modules
  playwright-browsers:
    name: consultora-dh-playwright-browsers
  document-work:
    name: consultora-dh-document-work
