# ---------------------------------------------------------------------------
# Consultora DH - local development environment
#
# Run every command from the project root (the directory that holds this file):
#     docker compose up -d
#     docker compose exec app php artisan migrate
#
# PostgreSQL and Redis are intentionally NOT published to the host: they are
# only reachable from inside the `consultora-dh` network. Only nginx (8080) and
# the Vite development server (5173) are exposed to the Windows browser.
# ---------------------------------------------------------------------------

name: consultora-dh

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: consultora-dh/app:local

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:18.6
    container_name: consultora-dh-postgres
    restart: unless-stopped
    environment:
      # --- Bootstrap role (superuser), used ONLY by the initialisation script.
      # The official image always creates POSTGRES_USER as a superuser.
      POSTGRES_DB: ${POSTGRES_DB:-consultora_dh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

      # --- Application role, passed here only so the initialisation script can
      # create it as a NON-superuser owner of the Consultora DH databases.
      # Laravel reads DB_USERNAME / DB_PASSWORD from .env directly.
      DB_DATABASE: ${DB_DATABASE:-consultora_dh}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-consultora_dh_test}
      # The end to end database. Created alongside the other two, for the same
      # reason: the Playwright suite writes real records and must not write them
      # into development.
      DB_E2E_DATABASE: ${DB_E2E_DATABASE:-consultora_dh_e2e}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

      # Deterministic collation, independent of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # PostgreSQL 18 stores its data in a version specific subdirectory of
      # /var/lib/postgresql, so the volume is mounted at the parent directory.
      # Mounting /var/lib/postgresql/data directly is rejected by the image.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-consultora_dh} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - consultora-dh

  redis:
    image: redis:8.10.2-alpine
    container_name: consultora-dh-redis
    restart: unless-stopped
    # Cache, session store, rate-limit counters and the queue broker.
    # Persistence is enabled (appendonly) so that a restart does not silently
    # drop queued jobs or invalidate every active administrator session.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      # The server requires a password, so the probe has to authenticate.
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - consultora-dh

  # ----------------------------------------------------------- application
  app:
    <<: *app-image
    container_name: consultora-dh-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Named volumes keep the two large dependency trees inside the Docker
      # filesystem. Reading them through the host bind mount is dramatically
      # slower (WSL 9p / Docker Desktop gRPC-FUSE).
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/consultora-dh-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - consultora-dh

  # Queue worker. Foundation only in A01, but wired up and verified so that
  # long running work (imports, PDFs, notifications) has a home later.
  queue:
    <<: *app-image
    container_name: consultora-dh-queue
    restart: unless-stopped
    working_dir: /var/www/html
    # `--queue=default,imports` — the `imports` half is the fix.
    #
    # A04's three jobs call `onQueue(config('imports.queue.queue'))`, which is `imports`, so that
    # an import never competes with A03's generation backlog. But `queue:work` with no `--queue`
    # listens on `default` only. So this worker drained the default queue and never once touched
    # an import job: uploading a workbook in development returned 202 and left the batch in
    # `queued` for ever, with no error anywhere.
    #
    # Nothing caught it because the whole test suite runs with `QUEUE_CONNECTION=sync`, where the
    # queue name is irrelevant — the job runs inside the request. The bug only exists in the one
    # environment a human uses, which is the environment nobody tests.
    #
    # Both names are listed rather than only `imports` so this worker stays the single worker for
    # the application instead of needing a second container when another module starts queueing.
    command: ["php", "artisan", "queue:work", "--queue=default,imports", "--sleep=3", "--tries=3", "--max-time=3600", "--verbose"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultora-dh

  # ------------------------------------------------------------------- web
  nginx:
    image: nginx:1.31-alpine
    container_name: consultora-dh-nginx
    restart: unless-stopped
    ports:
      # Published on the loopback interface only, so the application is not
      # reachable from the local network. The Windows browser still reaches it
      # at http://localhost:<APP_PORT>.
      # Host port chosen after inspecting the ports already in use on the
      # development machine. See docs/DEVELOPMENT.md.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - consultora-dh

  # -------------------------------------------------------------- frontend
  node:
    image: node:24.21.0-bookworm-slim
    container_name: consultora-dh-node
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["bash", "docker/node/start.sh"]
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      # Playwright browsers are large; keep them out of the container layer.
      - playwright-browsers:/ms-playwright
    ports:
      # Loopback only: the dev asset server has no reason to be on the LAN.
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - consultora-dh

networks:
  consultora-dh:
    name: consultora-dh
    driver: bridge

volumes:
  postgres-data:
    name: consultora-dh-postgres-data
  redis-data:
    name: consultora-dh-redis-data
  vendor:
    name: consultora-dh-vendor
  node_modules:
    name: consultora-dh-node-modules
  playwright-browsers:
    name: consultora-dh-playwright-browsers
