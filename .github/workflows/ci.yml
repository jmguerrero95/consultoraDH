name: CI

# The gate that a merge has to pass, written down in the repository instead of
# in somebody's memory.
#
# Three jobs, each with one job to do:
#
#   php        — style, migrations and the whole test suite, on PostgreSQL 18
#   frontend   — lint, typecheck, build and the browser-less component tests
#   live       — the LIVE certification, on demand, with real credentials
#
# The live job never runs on a pull request: it needs real provider keys and a
# real quota, and a test that spends somebody's free tier on every push is a
# test that eventually gets skipped. It is run on demand and its evidence is
# attached to the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the LIVE provider certification as well'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP — style, migrations, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consultora_dh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      # 32 bytes, base64-encoded, because AES-256-CBC accepts exactly that:
      #   `php -r 'echo strlen(base64_decode("..."));'`
      #
      # The value this job used before decoded to 30 bytes, and the encrypter
      # refuses it with
      #
      #     RuntimeException: Unsupported cipher or incorrect key length.
      #
      # That made 1065 tests fail in CI while every one of them passed locally,
      # where `.env` holds a real key. It is a fixed, public, fake key on
      # purpose: the suite needs a key, not a secret.
      APP_KEY: base64:Y29uc3VsdG9yYS1kaC1jaS1mYWtlLWtleS0zMmJ5dGU=
      DB_CONNECTION: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_TEST_DATABASE: consultora_dh_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DB: '4'
      REDIS_CACHE_DB: '5'
      REDIS_PREFIX: consultora-dh-test-
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      # `'null'`, quoted, and not the YAML null.
      #
      # The framework's own convention for "no broadcasting" is the *string*
      # `null` — `config/broadcasting.php` reads `env('BROADCAST_CONNECTION',
      # 'null')`. Written unquoted, YAML turns it into the null value, GitHub
      # Actions passes it as the empty string, and `composer install` dies in
      # its `post-autoload-dump` step with
      #
      #     In BroadcastManager.php line 304:
      #       Broadcast connection [] is not defined.
      #
      # before a single test has run. The quoted form is what `phpunit.xml`
      # already uses for the same variable.
      BROADCAST_CONNECTION: 'null'
      # No provider credential reaches the suite: a test that needs one builds
      # its own fake. A credential here would let a test spend a real quota.
      AI_PRIMARY_API_KEY: ''
      AI_FALLBACK_API_KEY: ''
      GROQ_API_KEY: ''
      GEMINI_API_KEY: ''
      CLOUDFLARE_AI_API_TOKEN: ''
      OPENCODE_ZEN_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      # The suite boots the framework for every test, and the framework reads
      # `.env`. Without the file, phpdotenv emits a warning per test (2 296 of
      # them in this job) and every test is reported as a warning instead of a
      # pass; `EndToEndIsolationTest`, which checks that the environment names
      # three different databases, also has nothing to read. The example file is
      # the repository's own template, so this checks the template as well. The
      # real values still come from the job `env:` block: Dotenv is immutable, so
      # an existing environment variable wins over the file.
      - name: Create the environment file from the template
        run: cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pcntl, intl, bcmath, zip, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Migrations
        run: php artisan migrate --force

      # The Blade views call `@vite`, so the PHP suite needs the manifest that
      # `npm run build` writes to `public/build`. In CI there is no `public/hot`
      # either, so without this step every test that renders a page receives a
      # 500 `ViteManifestNotFoundException` — 25 of them here, while all of them
      # pass locally, where `public/build` already exists. Building the assets
      # is the faithful fix: the suite then renders the views the same way the
      # application does, instead of being told to skip them.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build the assets the views reference
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Tests
        run: php artisan test --compact

  frontend:
    name: Frontend — lint, typecheck, build, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  live:
    name: LIVE — certification against the real providers
    # Never on a pull request: it needs real credentials and a real quota.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consultora_dh_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      # The same 32-byte fake key as the `php` job: the LIVE run also boots the
      # encrypter, and a 30-byte key cannot.
      APP_KEY: base64:Y29uc3VsdG9yYS1kaC1jaS1mYWtlLWtleS0zMmJ5dGU=
      DB_CONNECTION: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_TEST_DATABASE: consultora_dh_live
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pcntl, intl, bcmath, zip, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrations
        run: php artisan migrate --force

      # The credentials come from the repository secrets, never from the
      # repository itself.
      #
      # ## Why this checks three and not four
      #
      # The policy (`docs/RELEASE_ACCEPTANCE_POLICY.md`) asks for **three
      # independent providers certified**. Demanding four particular ones was
      # stricter than the policy: a deployment with Groq, Gemini and Cloudflare
      # — three independent providers — could not run the certification at all,
      # because OpenRouter happened not to be configured. The gate now counts
      # the providers that are really usable and requires three of them.
      #
      # `scripts/live_provider_gate.sh` holds the decision, and
      # `scripts/test-live-provider-gate.sh` proves it against synthetic
      # credentials, so the rule is the same in the workflow and in the tests.
      - name: Provider credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODELS: ${{ vars.CLOUDFLARE_AI_MODELS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
        run: bash scripts/live_provider_gate.sh --print

      - name: Configuration preflight
        run: php artisan ai:preflight --json

      # The live evidence is written to a file and uploaded as an artifact, so
      # the certification is a document somebody can read and not a green tick.
      - name: LIVE certification
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODELS: ${{ vars.CLOUDFLARE_AI_MODELS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          php artisan ai:preflight --json | tee evidence/ai-preflight.json
          if [ -x scripts/live_certification.sh ]; then
            bash scripts/live_certification.sh | tee evidence/live-certification.txt
          else
            echo "scripts/live_certification.sh is not present in this branch." | tee evidence/live-certification.txt
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-certification-evidence
          path: evidence/
          if-no-files-found: warn
